<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brame Développement · Accès pricing</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --bg:#FAF8F2; --ink:#1A1916; --ink-2:#3D3B37; --ink-3:#92908A; --panel:#FFFFFF; --rule:#E8E5DE; --line:#D5D1C7; --danger:#A32D2D; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans', -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; padding: 24px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 40px 42px; max-width: 440px; width: 100%; box-shadow: 0 2px 12px rgba(26,25,22,0.04); }
.brand { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-3); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
h1 { font-size: 22px; font-weight: 500; letter-spacing: -0.3px; margin-bottom: 8px; }
.subtitle { color: var(--ink-3); font-size: 13.5px; margin-bottom: 32px; line-height: 1.5; }
label { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--ink-3); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 6px; }
input[type=text], input[type=password] { width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 4px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; background: var(--bg); color: var(--ink); transition: border-color 0.15s; }
input:focus { outline: none; border-color: var(--ink); background: var(--panel); }
.field { margin-bottom: 20px; }
button { width: 100%; padding: 12px; background: var(--ink); color: var(--bg); border: 0; border-radius: 4px; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; letter-spacing: 0.2px; transition: opacity 0.15s; margin-top: 8px; }
button:hover { opacity: 0.85; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
.error { color: var(--danger); font-family: 'IBM Plex Mono', monospace; font-size: 11px; margin-top: 14px; padding: 9px 12px; background: rgba(163,45,45,0.08); border-left: 3px solid var(--danger); display: none; }
.error.show { display: block; }
.footer { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--rule); font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--ink-3); text-align: center; letter-spacing: 0.5px; }
</style>
</head>
<body>
<div class="card">
    <div class="brand">Brame Développement</div>
    <h1>Pilotage pricing</h1>
    <p class="subtitle">CAP'EMBAL · LEGAA · Accès restreint aux données commerciales.</p>

    <form id="loginForm" autocomplete="off">
        <div class="field">
            <label for="user">Identifiant</label>
            <input type="text" id="user" required autofocus>
        </div>
        <div class="field">
            <label for="pass">Mot de passe</label>
            <input type="password" id="pass" required>
        </div>
        <button type="submit" id="submitBtn">Accéder au dashboard</button>
        <div class="error" id="errorMsg">Identifiants incorrects</div>
    </form>

    <div class="footer">SESSION EXPIRE APRÈS 8H · v9</div>
</div>

<script>
// ===== CONFIGURATION =====
// Hash SHA-256 du couple "user:password" (concaténés par ':')
// À changer dans ce fichier avant publication. Genère un nouveau hash via :
//   echo -n "alexandre:motdepasse" | sha256sum
const VALID_HASHES = [
    // Alexandre — à personnaliser :
    "288a9759414ad353808c127a85216c75ebe4e03bcec0f4b5d4f5d13835e59d69", // alexandre / Capembal59520!
];
const DASHBOARD_URL = "dashboard.html";
const SESSION_HOURS = 8;

// ===== LOGIC =====
async function sha256(str) {
    const buf = new TextEncoder().encode(str);
    const hash = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// Vérifier si session déjà active
(function checkExistingSession() {
    const s = sessionStorage.getItem('brame_auth');
    if (s) {
        try {
            const { expiresAt } = JSON.parse(s);
            if (Date.now() < expiresAt) {
                window.location.href = DASHBOARD_URL;
            }
        } catch(e) {}
    }
})();

document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const user = document.getElementById('user').value.trim();
    const pass = document.getElementById('pass').value;
    const btn = document.getElementById('submitBtn');
    const err = document.getElementById('errorMsg');
    err.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'Vérification…';

    try {
        const h = await sha256(user + ':' + pass);
        if (VALID_HASHES.includes(h)) {
            const expiresAt = Date.now() + SESSION_HOURS * 3600 * 1000;
            sessionStorage.setItem('brame_auth', JSON.stringify({ user, expiresAt }));
            window.location.href = DASHBOARD_URL;
        } else {
            err.classList.add('show');
            btn.disabled = false;
            btn.textContent = 'Accéder au dashboard';
            document.getElementById('pass').value = '';
            document.getElementById('pass').focus();
        }
    } catch (ex) {
        console.error(ex);
        err.textContent = 'Erreur de vérification';
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Accéder au dashboard';
    }
});
</script>
</body>
</html>
